<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的博客</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 音乐播放器 -->
  <div id="music-player" class="music-player" title="播放环境音乐">
    <button id="music-toggle" class="music-toggle">🎵</button>
  </div>

  <header class="header">
    <div class="container">
      <h1 class="logo"><a href="#/">✍ 我的博客</a></h1>
      <nav class="nav">
        <a href="#/" class="btn-home">首页</a>
        <a href="#/publish" class="btn-publish">+ 发布文章</a>
      </nav>
    </div>
  </header>

  <main class="main container">
    <!-- 文章列表页 -->
    <section id="home-page">
      <!-- 首页 Banner -->
      <div class="hero-banner">
        <div class="hero-overlay">
          <h2>分享思考，记录生活</h2>
          <p>每个人都可以在这里书写自己的故事</p>
        </div>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="搜索文章标题、摘要、分类...">
        <span class="search-icon">🔍</span>
      </div>
      <div id="article-list"></div>
      <div id="search-empty" class="empty-msg" style="display:none;">没有找到匹配的文章</div>
    </section>

    <!-- 文章详情页 -->
    <section id="post-page" style="display:none;">
      <button id="back-btn" class="back-btn">← 返回首页</button>
      <article id="post-content"></article>
      <section class="comments">
        <h3>评论</h3>
        <div id="giscus-container"></div>
      </section>
    </section>

    <!-- 发布文章页 -->
    <section id="publish-page" style="display:none;">
      <button id="back-btn2" class="back-btn">← 返回首页</button>
      <h2 class="publish-title">发布文章</h2>
      <form id="publish-form" class="publish-form">
        <input type="text" id="publish-title" placeholder="文章标题" required maxlength="100">
        <select id="publish-category" required>
          <option value="">选择分类</option>
          <option value="技术">技术</option>
          <option value="生活">生活</option>
          <option value="随笔">随笔</option>
        </select>
        <input type="url" id="publish-image" placeholder="封面图片链接（可选，粘贴 Unsplash 等图片的网址）">
        <textarea id="publish-body" placeholder="文章正文（支持 Markdown 格式）" required rows="16"></textarea>
        <div class="publish-actions">
          <span class="publish-hint">标题、分类和正文都要填哦</span>
          <button type="submit">发布</button>
        </div>
      </form>
      <div id="publish-success" class="empty-msg" style="display:none;">✅ 发布成功！<a href="#/">返回首页</a></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 我的博客 · 任何人都可以在这里分享</p>
    </div>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
